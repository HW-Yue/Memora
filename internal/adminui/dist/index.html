<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Memora Admin</title>
    <link rel="stylesheet" href="/assets/app.css?v=3">
    <script src="/assets/vendor/g6-5.1.1.min.js?v=1"></script>
    <script src="/assets/vendor/markdown-it-15.0.0.min.js?v=1"></script>
    <script src="/assets/vendor/dompurify-3.4.7.min.js?v=1"></script>
    <script type="module" src="/assets/app.js?v=3"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/catalog" aria-label="Memora Admin Catalog">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span>Memora Admin</span>
        </a>
        <div class="local-badge" title="本地只读">只读</div>
        <div class="archive-badge" data-archive-badge hidden>正在查看已归档对象</div>
      </header>
      <div class="workspace">
        <nav class="sidebar" aria-label="Admin 导航">
          <a class="nav-item" href="/catalog" data-route data-nav="catalog">Catalog</a>
          <a class="nav-item" href="/changes" data-route data-nav="changes">Changes</a>
          <a class="nav-item" href="/traces" data-route data-nav="traces">Route Traces</a>
          <button class="nav-item nav-toggle" type="button" data-archive-toggle aria-pressed="false">
            已归档
          </button>
        </nav>
        <main class="content" id="app-shell">
          <section class="session-card" aria-live="polite" data-session-state="bootstrapping">
            <span class="status-dot" aria-hidden="true"></span>
            <div>
              <p class="status-title" data-status-title>正在建立本地只读会话</p>
              <p class="status-detail" data-status-detail>验证一次性凭据并连接 Memora daemon…</p>
            </div>
          </section>
          <section class="route-outlet" aria-label="页面内容" data-page-state="loading"></section>
        </main>
      </div>
    </div>
  </body>
</html>
