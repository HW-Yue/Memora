name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both platforms run the same six gates. macOS is where development
    # happens; Linux is where anyone else's machine and every container is, and
    # the storage layer is full of file-system behaviour that differs between
    # them. sqlite3 requires CGO; the cgo-build stage opens a real database.
    name: ${{ matrix.os }} tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run CI gates
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-Wno-deprecated-declarations"
        run: ./scripts/ci.sh
