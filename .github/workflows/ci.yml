name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both platforms run the same six gates. macOS is where development
    # happens; Linux is where anyone else's machine and every container is, and
    # the storage layer is full of file-system behaviour that differs between
    # them. sqlite3 requires CGO; the cgo-build stage opens a real database.
    name: ${{ matrix.os }} tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED is deliberately not set at this level. The gate run sweeps
      # both supported platforms, and Go turns cgo off by itself for a
      # cross-compile only while the variable is unset — so a job-level
      # CGO_ENABLED=1 made the GOOS=linux sweep build the linux cgo runtime
      # with the macOS compiler and failed every run. Each stage in
      # scripts/ci.sh owns its cgo decision instead; see the devgate test
      # TestCICGOBelongsToStages.
      - name: Run CI gates
        env:
          CGO_CFLAGS: "-Wno-deprecated-declarations"
        run: ./scripts/ci.sh
