name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  unavailable:
    name: Publication pipeline not on this kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse to ship without a CGO publication Feature
        run: |
          printf '%s\n' \
            'Signed publication tools (publication.sh, verify-publication, smoke-release,' \
            'clean-machine-acceptance) are not in this SQLite tree.' \
            'Do not tag a release until a dedicated CGO publication Feature lands.' >&2
          exit 1
