name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: memora-release-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify tag, test, and build
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.trigger.outputs.version }}
      commit: ${{ steps.trigger.outputs.commit }}
      tag: ${{ steps.trigger.outputs.tag }}
    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify signed annotated tag
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reference_json="$RUNNER_TEMP/tag-reference.json"
          tag_json="$RUNNER_TEMP/tag-object.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" >"$reference_json"
          tag_object_sha=$(jq -er '.object.sha' "$reference_json")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" >"$tag_json"
          target_commit=$(jq -er '.object.sha' "$tag_json")
          target_in_main=false
          if git merge-base --is-ancestor "$target_commit" refs/remotes/origin/main; then
            target_in_main=true
          fi
          release_exists=false
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_exists=true
          fi
          checkout_commit=$(git rev-parse HEAD)
          go run ./cmd/validate-release-trigger \
            --event "$GITHUB_EVENT_NAME" \
            --ref-type "$GITHUB_REF_TYPE" \
            --ref-name "$GITHUB_REF_NAME" \
            --checkout-commit "$checkout_commit" \
            --target-in-main="$target_in_main" \
            --release-exists="$release_exists" \
            --reference-json "$reference_json" \
            --tag-json "$tag_json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run all CI gates
        run: ./scripts/ci.sh

      - name: Build publication from tag commit
        env:
          MEMORA_RELEASE_SIGNING_KEY: ${{ secrets.MEMORA_RELEASE_SIGNING_KEY }}
          MEMORA_RELEASE_SIGNER_KEY_ID: ${{ secrets.MEMORA_RELEASE_SIGNER_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          signing_key="$RUNNER_TEMP/release-signing.key"
          cleanup() { rm -f -- "$signing_key"; }
          trap cleanup EXIT HUP INT TERM
          printf '%s\n' "$MEMORA_RELEASE_SIGNING_KEY" >"$signing_key"
          export MEMORA_RELEASE_SIGNING_KEY_FILE="$signing_key"
          ./scripts/publication.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/publication"

      - name: Verify publication
        env:
          MEMORA_RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.MEMORA_RELEASE_SIGNING_PUBLIC_KEY }}
          MEMORA_RELEASE_SIGNER_KEY_ID: ${{ secrets.MEMORA_RELEASE_SIGNER_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          public_key="$RUNNER_TEMP/release-signing.pub"
          printf '%s\n' "$MEMORA_RELEASE_SIGNING_PUBLIC_KEY" >"$public_key"
          go run ./cmd/verify-publication \
            --directory "$RUNNER_TEMP/publication" \
            --version "${GITHUB_REF_NAME#v}" \
            --trusted-key-id "$MEMORA_RELEASE_SIGNER_KEY_ID" \
            --trusted-public-key "$public_key"

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memora-publication-${{ github.sha }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 2

  smoke:
    name: Smoke ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: memora-publication-${{ github.sha }}
          path: ${{ runner.temp }}/publication

      - name: Verify downloaded publication
        env:
          MEMORA_RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.MEMORA_RELEASE_SIGNING_PUBLIC_KEY }}
          MEMORA_RELEASE_SIGNER_KEY_ID: ${{ secrets.MEMORA_RELEASE_SIGNER_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          public_key="$RUNNER_TEMP/release-signing.pub"
          printf '%s\n' "$MEMORA_RELEASE_SIGNING_PUBLIC_KEY" >"$public_key"
          go run ./cmd/verify-publication \
            --directory "$RUNNER_TEMP/publication" \
            --version "${GITHUB_REF_NAME#v}" \
            --trusted-key-id "$MEMORA_RELEASE_SIGNER_KEY_ID" \
            --trusted-public-key "$public_key"

      - name: Run native release smoke
        run: ./scripts/smoke-release.sh "$RUNNER_TEMP/publication/release" "${GITHUB_REF_NAME#v}" "${{ matrix.arch }}"

  acceptance:
    name: Clean machine ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: memora-publication-${{ github.sha }}
          path: ${{ runner.temp }}/publication

      - name: Run zero-to-first-memory journey
        run: ./scripts/clean-machine-acceptance.sh "$RUNNER_TEMP/publication" "${GITHUB_REF_NAME#v}" "${{ matrix.arch }}" "$RUNNER_TEMP/acceptance"

      - name: Upload acceptance report and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memora-acceptance-${{ github.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: warn
          retention-days: 14

  release_gate:
    name: Verify clean-machine release blockers
    needs:
      - prepare
      - smoke
      - acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: memora-publication-${{ github.sha }}
          path: ${{ runner.temp }}/publication

      - name: Download arm64 acceptance report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: memora-acceptance-${{ github.sha }}-arm64
          path: ${{ runner.temp }}/acceptance/arm64

      - name: Download amd64 acceptance report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: memora-acceptance-${{ github.sha }}-amd64
          path: ${{ runner.temp }}/acceptance/amd64

      - name: Verify both acceptance reports
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          MEMORA_RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.MEMORA_RELEASE_SIGNING_PUBLIC_KEY }}
          MEMORA_RELEASE_SIGNER_KEY_ID: ${{ secrets.MEMORA_RELEASE_SIGNER_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          public_key="$RUNNER_TEMP/release-signing.pub"
          printf '%s\n' "$MEMORA_RELEASE_SIGNING_PUBLIC_KEY" >"$public_key"
          go run ./cmd/verify-publication \
            --directory "$RUNNER_TEMP/publication" \
            --version "$RELEASE_VERSION" \
            --trusted-key-id "$MEMORA_RELEASE_SIGNER_KEY_ID" \
            --trusted-public-key "$public_key"
          go run ./cmd/verify-clean-machine-acceptance \
            --directory "$RUNNER_TEMP/acceptance/arm64" \
            --publication "$RUNNER_TEMP/publication" \
            --version "$RELEASE_VERSION" \
            --arch arm64
          go run ./cmd/verify-clean-machine-acceptance \
            --directory "$RUNNER_TEMP/acceptance/amd64" \
            --publication "$RUNNER_TEMP/publication" \
            --version "$RELEASE_VERSION" \
            --arch amd64

  publish:
    name: Publish verified GitHub Release
    needs:
      - prepare
      - release_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: memora-publication-${{ github.sha }}
          path: ${{ runner.temp }}/publication

      - name: Verify and publish draft atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          MEMORA_RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.MEMORA_RELEASE_SIGNING_PUBLIC_KEY }}
          MEMORA_RELEASE_SIGNER_KEY_ID: ${{ secrets.MEMORA_RELEASE_SIGNER_KEY_ID }}
        run: |
          set -Eeuo pipefail
          publication="$RUNNER_TEMP/publication"
          umask 077
          public_key="$RUNNER_TEMP/release-signing.pub"
          printf '%s\n' "$MEMORA_RELEASE_SIGNING_PUBLIC_KEY" >"$public_key"
          go run ./cmd/verify-publication \
            --directory "$publication" \
            --version "$RELEASE_VERSION" \
            --trusted-key-id "$MEMORA_RELEASE_SIGNER_KEY_ID" \
            --trusted-public-key "$public_key"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'release: %s already exists\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          created=false
          cleanup_draft() {
            if [[ "$created" = true ]]; then
              state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
              if [[ "$state" = true ]]; then
                gh release delete "$RELEASE_TAG" --yes || true
              fi
            fi
          }
          trap cleanup_draft ERR
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --fail-on-no-commits \
            --generate-notes \
            --target "$RELEASE_COMMIT" \
            --title "Memora $RELEASE_TAG"
          created=true
          gh release upload "$RELEASE_TAG" \
            "$publication/release/checksums.txt" \
            "$publication/release/memora_${RELEASE_VERSION}_darwin_amd64.tar.gz" \
            "$publication/release/memora_${RELEASE_VERSION}_darwin_arm64.tar.gz" \
            "$publication/memora_${RELEASE_VERSION}_skill_bundle.tar.gz" \
            "$publication/memora_${RELEASE_VERSION}_skill_bundle.tar.gz.sha256" \
            "$publication/release/release.json" \
            "$publication/release/release.sig"
          draft_json="$RUNNER_TEMP/release-draft.json"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets >"$draft_json"
          go run ./cmd/validate-release-draft \
            --json "$draft_json" \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION"
          gh release edit "$RELEASE_TAG" --draft=false --latest
          created=false
          trap - ERR

  sync_skill_repository:
    name: Sync HW-Yue/memora-skill
    needs:
      - prepare
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # skills/memora is the single source of truth; HW-Yue/memora-skill is a
      # publishing mirror. Before this job the mirror was copied by hand and had
      # drifted eight days and 165 SKILL.md lines behind, still pinning v0.1.0.
      - name: Publish the canonical Skill to the mirror
        env:
          SKILL_REPO_DEPLOY_KEY: ${{ secrets.SKILL_REPO_DEPLOY_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ -z "${SKILL_REPO_DEPLOY_KEY:-}" ]]; then
            printf 'SKILL_REPO_DEPLOY_KEY is not configured; cannot sync the Skill mirror\n' >&2
            exit 1
          fi

          # A write-enabled deploy key scoped to HW-Yue/memora-skill. Kept in the
          # runner's temp directory so it never lands in the workspace, and used
          # only through GIT_SSH_COMMAND for this one clone and push.
          ssh_directory="$RUNNER_TEMP/skill-sync-ssh"
          mkdir -p "$ssh_directory"
          chmod 700 "$ssh_directory"
          printf '%s\n' "$SKILL_REPO_DEPLOY_KEY" >"$ssh_directory/id_ed25519"
          chmod 600 "$ssh_directory/id_ed25519"
          ssh-keyscan -t ed25519 github.com >"$ssh_directory/known_hosts" 2>/dev/null
          if [[ ! -s "$ssh_directory/known_hosts" ]]; then
            printf 'could not resolve the github.com host key; refusing to sync\n' >&2
            exit 1
          fi
          chmod 600 "$ssh_directory/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_directory/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_directory/known_hosts -o StrictHostKeyChecking=yes"

          mirror="$RUNNER_TEMP/memora-skill"
          git clone --depth 1 git@github.com:HW-Yue/memora-skill.git "$mirror"

          # Replace the published tree wholesale so deletions propagate too.
          rm -rf "$mirror/memora"
          mkdir -p "$mirror/memora"
          cp -R skills/memora/. "$mirror/memora/"
          cp LICENSE COMMERCIAL-LICENSE.md "$mirror/"

          # The mirror must be byte-identical to the source it claims to publish.
          if ! diff -r skills/memora "$mirror/memora" >/dev/null; then
            printf 'Skill mirror does not match skills/memora after copy\n' >&2
            exit 1
          fi

          cd "$mirror"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage first, then ask. `git diff` cannot see untracked files, so
          # checking before staging silently skips a release whose only change
          # is a newly added Skill file.
          git add -A
          if git diff --cached --quiet; then
            printf 'Skill mirror already matches %s; nothing to publish\n' "$RELEASE_TAG"
            exit 0
          fi
          git commit \
            -m "sync: Memora ${RELEASE_TAG} canonical Skill" \
            -m "Source: HW-Yue/Memora@${RELEASE_COMMIT} (${RELEASE_TAG})" \
            -m "Generated by the Memora release workflow; edit skills/memora in HW-Yue/Memora, never this mirror."
          git push origin HEAD
