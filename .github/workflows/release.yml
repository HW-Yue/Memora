name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: memora-release-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify tag, test, and build
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.trigger.outputs.version }}
      commit: ${{ steps.trigger.outputs.commit }}
      tag: ${{ steps.trigger.outputs.tag }}
    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify signed annotated tag
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reference_json="$RUNNER_TEMP/tag-reference.json"
          tag_json="$RUNNER_TEMP/tag-object.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" >"$reference_json"
          tag_object_sha=$(jq -er '.object.sha' "$reference_json")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" >"$tag_json"
          target_commit=$(jq -er '.object.sha' "$tag_json")
          target_in_main=false
          if git merge-base --is-ancestor "$target_commit" refs/remotes/origin/main; then
            target_in_main=true
          fi
          release_exists=false
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_exists=true
          fi
          checkout_commit=$(git rev-parse HEAD)
          go run ./cmd/validate-release-trigger \
            --event "$GITHUB_EVENT_NAME" \
            --ref-type "$GITHUB_REF_TYPE" \
            --ref-name "$GITHUB_REF_NAME" \
            --checkout-commit "$checkout_commit" \
            --target-in-main="$target_in_main" \
            --release-exists="$release_exists" \
            --reference-json "$reference_json" \
            --tag-json "$tag_json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run all CI gates
        run: ./scripts/ci.sh

      - name: Build publication from tag commit
        run: ./scripts/publication.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/publication"

      - name: Verify publication
        run: go run ./cmd/verify-publication --directory "$RUNNER_TEMP/publication" --version "${GITHUB_REF_NAME#v}"

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memora-publication-${{ github.sha }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 2

  smoke:
    name: Smoke ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: memora-publication-${{ github.sha }}
          path: ${{ runner.temp }}/publication

      - name: Verify downloaded publication
        run: go run ./cmd/verify-publication --directory "$RUNNER_TEMP/publication" --version "${GITHUB_REF_NAME#v}"

      - name: Run native release smoke
        run: ./scripts/smoke-release.sh "$RUNNER_TEMP/publication/release" "${GITHUB_REF_NAME#v}" "${{ matrix.arch }}"

  publish:
    name: Publish verified GitHub Release
    needs:
      - prepare
      - smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: memora-publication-${{ github.sha }}
          path: ${{ runner.temp }}/publication

      - name: Verify and publish draft atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -Eeuo pipefail
          publication="$RUNNER_TEMP/publication"
          go run ./cmd/verify-publication --directory "$publication" --version "$RELEASE_VERSION"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'release: %s already exists\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          created=false
          cleanup_draft() {
            if [[ "$created" = true ]]; then
              state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
              if [[ "$state" = true ]]; then
                gh release delete "$RELEASE_TAG" --yes || true
              fi
            fi
          }
          trap cleanup_draft ERR
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --fail-on-no-commits \
            --generate-notes \
            --target "$RELEASE_COMMIT" \
            --title "Memora $RELEASE_TAG"
          created=true
          gh release upload "$RELEASE_TAG" \
            "$publication/release/checksums.txt" \
            "$publication/release/memora_${RELEASE_VERSION}_darwin_amd64.tar.gz" \
            "$publication/release/memora_${RELEASE_VERSION}_darwin_arm64.tar.gz" \
            "$publication/memora_${RELEASE_VERSION}_skill_bundle.tar.gz" \
            "$publication/memora_${RELEASE_VERSION}_skill_bundle.tar.gz.sha256" \
            "$publication/release/release.json"
          draft_json="$RUNNER_TEMP/release-draft.json"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets >"$draft_json"
          go run ./cmd/validate-release-draft \
            --json "$draft_json" \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION"
          gh release edit "$RELEASE_TAG" --draft=false --latest
          created=false
          trap - ERR
